[project]
name = "romanian-learning-app"
version = "0.1.0"
description = "Telegram bot for learning Romanian verbs"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
]

[project.optional-dependencies]
scripts = [
    "requests>=2.33.1",
    "wordfreq>=3.1.1",
]
